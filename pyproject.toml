[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreach"
version = "0.1.0"
description = "Reachability-based vulnerability triage for Python projects"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "unidiff>=0.7",
    "packaging>=21.0",
]

[project.scripts]
vulnreach = "vulnreach.cli:main"

[tool.setuptools.packages.find]
include = ["vulnreach*"]
